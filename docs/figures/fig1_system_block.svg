<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" font-family="Noto Sans CJK SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
<defs>
<marker id="ah" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 z" fill="#000"/></marker>
<marker id="ahs" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#555"/></marker>
<marker id="ahb" markerWidth="8" markerHeight="6" refX="0.5" refY="3" orient="auto"><path d="M8 0 L0 3 L8 6 z" fill="#000"/></marker>
</defs>
<style>
 .bx{fill:#fff;stroke:#000;stroke-width:1.2}
 .lane{fill:#fafafa;stroke:#c8c8c8;stroke-width:0.8}
 .t{font-size:14px;fill:#000;text-anchor:middle}
 .ts{font-size:12px;fill:#333;text-anchor:middle}
 .hd{font-size:13px;font-weight:bold;fill:#000}
 .hs{font-size:12px;fill:#555}
 .el{font-size:12px;fill:#222}
 .ln{stroke:#000;stroke-width:1.1;fill:none;marker-end:url(#ah)}
 .dl{stroke:#444;stroke-width:1.1;fill:none;stroke-dasharray:4 3;marker-end:url(#ahs)}
</style>

<!-- ===== 感知层 ===== -->
<text class="hs" x="12" y="182">感知层</text>
<rect class="bx" x="12" y="190" width="118" height="60"/>
<text class="t" x="71" y="214">SHT30</text><text class="ts" x="71" y="232">温湿度传感器</text>
<text class="el" x="10" y="272">I²C 总线 1</text><text class="el" x="10" y="285">SDA 17 / SCL 18</text>
<path class="ln" d="M130 206 C148 200 150 130 165 112"/>
<path class="ln" d="M130 238 C148 260 150 370 165 392"/>

<!-- ===== 片上决策域 ===== -->
<rect x="145" y="15" width="500" height="560" rx="6" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="9 5"/>
<text x="395" y="37" font-size="15.5" font-weight="bold" text-anchor="middle">ESP32-S3 片上决策域</text>
<text x="395" y="53" font-size="11.5" fill="#444" text-anchor="middle">全部判定在片上完成 · 断网不影响框内任何功能</text>

<!-- lane A -->
<rect class="lane" x="157" y="62" width="476" height="84"/>
<text class="hd" x="165" y="77">① 感知任务　周期 2 s</text>
<rect class="bx" x="170" y="86" width="118" height="46"/>
<text class="t" x="229" y="105">中值滤波</text><text class="ts" x="229" y="121">5 点窗口</text>
<path class="ln" d="M288 109 H313"/>
<rect class="bx" x="315" y="82" width="175" height="54"/>
<text class="t" x="402" y="99">自适应基线</text><text class="ts" x="402" y="114">EMA 均值 / 偏差</text><text class="ts" x="402" y="128">带宽受硬限值钳制</text>
<path class="ln" d="M490 103 H511"/><path class="ln" d="M511 118 H492"/>
<path class="bx" d="M515 94 a55 8 0 0 1 110 0 v32 a55 8 0 0 1 -110 0 z"/>
<path d="M515 94 a55 8 0 0 0 110 0" fill="none" stroke="#000" stroke-width="1.2"/>
<text class="ts" x="570" y="118">NVS 掉电保存</text>

<!-- lane B -->
<rect class="lane" x="157" y="158" width="476" height="88"/>
<text class="hd" x="165" y="173">② 边缘推理</text><text class="el" x="288" y="173">每 10 s 取 1 样本</text>
<rect class="bx" x="170" y="182" width="118" height="54"/>
<text class="t" x="229" y="203">12 样本滑动窗口</text><text class="ts" x="229" y="221">= 2 min</text>
<path class="ln" d="M288 209 H313"/>
<rect class="bx" x="315" y="182" width="110" height="54"/>
<text class="t" x="370" y="213">边缘推理器</text>
<path class="ln" d="M425 209 H448"/>
<rect class="bx" x="450" y="180" width="175" height="58"/>
<text class="t" x="537" y="199">EdgeAssessment</text><text class="ts" x="537" y="214">状态 / 严重度</text><text class="ts" x="537" y="228">置信度 / 原因码</text>
<path class="ln" d="M278 132 V178"/>

<!-- lane C -->
<rect class="lane" x="157" y="258" width="476" height="64"/>
<text class="hd" x="165" y="273">③ 上报调度</text>
<rect class="bx" x="315" y="280" width="190" height="36"/>
<text class="t" x="410" y="303">上报打包与缓存队列</text>
<path class="ln" d="M537 238 C537 262 470 262 420 278"/>

<!-- lane D -->
<rect class="lane" x="157" y="340" width="476" height="94"/>
<text class="hd" x="165" y="355">④ 安全任务　周期 1 s</text>
<text class="hs" x="165" y="368">FreeRTOS 独立任务，先于 Wi-Fi 启动，不经过任何网络调用</text>
<rect class="bx" x="170" y="374" width="212" height="52"/>
<text class="t" x="276" y="392">限值与阈值判定</text><text class="ts" x="276" y="407">硬限值 45 °C / 95 %RH</text><text class="ts" x="276" y="420">报警阈值 30 °C / 70 %RH</text>

<!-- whitelist -->
<rect class="bx" x="400" y="466" width="230" height="56"/>
<text class="t" x="515" y="487">命令白名单校验</text><text class="ts" x="515" y="503">本地告警期间</text><text class="ts" x="515" y="516">拒绝一切远程静音命令</text>

<!-- ===== 执行层 ===== -->
<rect x="175" y="622" width="470" height="102" fill="none" stroke="#000" stroke-width="1.2"/>
<text class="hs" x="183" y="716">执行与人机交互（板载）</text>
<rect class="bx" x="195" y="648" width="140" height="56"/>
<text class="t" x="265" y="672">蜂鸣器</text><text class="ts" x="265" y="690">GPIO 4</text>
<rect class="bx" x="380" y="648" width="200" height="56"/>
<text class="t" x="480" y="668">OLED 显示</text><text class="ts" x="480" y="683">数据页 / 告警页</text><text class="ts" x="480" y="697">I²C 总线 2　SDA 38 / SCL 39</text>

<path class="ln" d="M215 426 V646"/>
<path class="ln" d="M340 426 C360 520 400 580 430 646"/>
<text class="el" x="344" y="452">告警原因 + 实测值</text>
<path class="ln" d="M400 494 H250 V646"/>
<path class="ln" d="M515 522 V646"/>
<text class="el" x="521" y="560">仅 buzzer_on / off</text><text class="el" x="521" y="573">oled:&lt;text&gt;</text>

<!-- OLED data path channel -->
<path class="ln" d="M350 136 V151 H157 V752 H480 V708"/>
<text class="el" x="200" y="746">数据页刷新</text>

<!-- ===== 网络边界 ===== -->
<line x1="670" y1="8" x2="670" y2="770" stroke="#666" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="664" y="556" font-size="12.5" fill="#666" text-anchor="middle" transform="rotate(-90 664 556)">网 络 边 界</text>

<!-- ===== 上报与记录层 ===== -->
<rect x="686" y="15" width="264" height="462" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
<text x="818" y="36" font-size="14" font-weight="bold" text-anchor="middle">上报与记录层</text>
<text x="818" y="51" font-size="11.5" fill="#444" text-anchor="middle">仅承载已得出的结论，不参与判定</text>
<rect class="bx" x="706" y="62" width="225" height="58"/>
<text class="t" x="818" y="82">华为云 IoTDA</text><text class="ts" x="818" y="98">属性上报 Environment</text><text class="ts" x="818" y="112">+ EdgeReasoning</text>
<rect class="bx" x="706" y="158" width="225" height="42"/>
<text class="t" x="818" y="184">本地后端（C++）</text>
<path class="bx" d="M708 233 a108 8 0 0 1 216 0 v40 a108 8 0 0 1 -216 0 z"/>
<path d="M708 233 a108 8 0 0 0 216 0" fill="none" stroke="#000" stroke-width="1.2"/>
<text class="t" x="816" y="254">SQLite 存证</text><text class="ts" x="816" y="270">edge_assessments 状态变化表</text>
<rect class="bx" x="706" y="308" width="225" height="52"/>
<text class="t" x="818" y="328">大模型叙述</text><text class="ts" x="818" y="344">可选 · 仅生成文字说明</text><text class="ts" x="818" y="356">不参与判定</text>
<rect class="bx" x="706" y="394" width="225" height="42"/>
<text class="t" x="818" y="420">Web 看板（展望）</text>

<path class="ln" d="M706 179 H676 V252 H706"/>
<path class="ln" d="M676 252 V334 H704"/>
<path class="ln" d="M676 334 V415 H704"/>

<!-- uplinks -->
<path class="ln" d="M505 293 H636 V91 H704"/>
<text class="el" x="512" y="286">60 s · MQTTS 属性上报</text>
<path class="ln" d="M505 308 H650 V179 H704"/>
<text class="el" x="493" y="333">2 s · HTTP POST /api/ingest</text>

<!-- downlink command bus -->
<path d="M706 108 H694 V448 H560 V464" class="dl"/>
<path d="M706 190 H694" fill="none" stroke="#444" stroke-width="1.1" stroke-dasharray="4 3"/>
<text class="el" x="566" y="442" fill="#444">远程命令（下行）</text>

<text x="12" y="778" font-size="12" fill="#000">注：网络边界右侧全部失效时，左侧的采样、判定、蜂鸣器告警与 OLED 显示均照常工作。</text>
</svg>
