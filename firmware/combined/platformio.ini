; Combined firmware for ESP32-S3: real SHT30 + OLED + local backend + Huawei Cloud IoTDA.
; Reports each cycle to BOTH the local /api/ingest backend and IoTDA over MQTTS,
; and accepts buzzer commands from either path.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
