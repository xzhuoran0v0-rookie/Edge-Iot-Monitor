# ============================================================
# Edge-Intelligence IoT Monitor — Example Configuration
# ============================================================
# Copy this file to config.yaml and fill in your values.
# config.yaml is excluded from version control (.gitignore).
# NEVER commit config.yaml — it may contain passwords.
# ============================================================

# ------------------------------------------------------------
# Backend HTTP Server
# The C++ DataIngestor listens on this address and port.
# ESP32-S3 devices POST to: http://<server.host>:<server.port>/api/ingest
# ------------------------------------------------------------
server:
  host: "0.0.0.0"          # Listen on all interfaces (use 127.0.0.1 for localhost only)
  port: 8080                # TCP port for the ingest endpoint
  max_connections: 32       # Maximum concurrent HTTP connections
  request_timeout_ms: 5000  # Reject requests that take longer than this (ms)

# ------------------------------------------------------------
# SQLite 3 Storage
# StorageEngine opens a local SQLite database file.
# Tables are created by `sql/schema.sql` (or automatically by StorageEngine::init()).
# ------------------------------------------------------------
sqlite:
  db_path: "sensor.db"       # SQLite database file path (relative or absolute)

# ------------------------------------------------------------
# Ollama AI Runtime
# LOCAL FALLBACK inference backend.
# Used when DeepSeek is disabled, has no api_key, or a cloud call fails.
# Ollama must be running: `ollama serve`
# Model must be pulled: `ollama pull qwen2.5:3b`
# ------------------------------------------------------------
ollama:
  host: "http://127.0.0.1"  # Ollama server address (local only — do not expose externally)
  port: 11434                # Default Ollama port
  model: "qwen2.5:3b"  # Exact model tag as shown in `ollama list`
  timeout_s: 120             # Max seconds to wait for inference response (CPU can be slow)
  max_tokens: 512            # Maximum tokens in the AI response
  temperature: 0.3           # Inference temperature (lower = more deterministic)

# ------------------------------------------------------------
# DeepSeek Cloud API — PRIMARY inference backend
# OpenAI-compatible /chat/completions. When enabled with a valid
# api_key, all analysis goes to DeepSeek first; any failure
# (network/timeout/HTTP error) falls back to local Ollama above.
# api_key can also be provided via the DEEPSEEK_API_KEY environment
# variable, which takes priority over this file. NEVER commit a real key.
# ------------------------------------------------------------
deepseek:
  enabled: true              # Use DeepSeek as the primary inference backend
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"     # or "deepseek-reasoner" for deeper analysis
  api_key: ""                # sk-... (or set DEEPSEEK_API_KEY env var)
  timeout_s: 30              # Max seconds to wait for a cloud response

# ------------------------------------------------------------
# DataFilter — IQR Anomaly Detection
# ------------------------------------------------------------
filter:
  window_seconds: 60         # Sliding window duration for IQR calculation
  iqr_multiplier: 1.5        # Anomaly threshold = Q1 - k*IQR or Q3 + k*IQR (k = this value)
  min_window_samples: 10     # Don't run IQR until this many samples are in the window

# ------------------------------------------------------------
# AIQueryDispatcher — Trigger Frequency
# ------------------------------------------------------------
ai:
  trigger_every_n_records: 20   # Run AI analysis after every N new sensor records
  max_window_records: 100       # Number of recent records fed into the AI prompt
  enabled: true                  # Set to false to disable AI calls entirely (for testing)

# ------------------------------------------------------------
# Storage — Insert Settings
# ------------------------------------------------------------
storage:
  # Reserved for future batching/optimizations; SQLite is local so defaults are fine.
  batch_size: 50
  flush_interval_ms: 5000

# ------------------------------------------------------------
# Device Allowlist
# Only device_ids in this list will be accepted by DataIngestor.
# Leave empty [] to accept any device_id (not recommended for production).
# ------------------------------------------------------------
devices:
  allowlist:
    - "esp32s3-001"
    - "esp32s3-002"
    - "esp32s3-003"
    # Add more device IDs here as needed

# ------------------------------------------------------------
# Optional Local API Security
# If command_api_key is non-empty, POST /api/commands requires:
#   X-Api-Key: <command_api_key>
# Leave empty for local-only development.
# ------------------------------------------------------------
security:
  command_api_key: ""

# ------------------------------------------------------------
# Sensor Validation — Acceptable Data Ranges
# Readings outside these ranges are rejected with HTTP 400.
# ------------------------------------------------------------
validation:
  temperature:
    min: -40.0               # Minimum valid temperature (°C)
    max: 85.0                # Maximum valid temperature (°C)
  humidity:
    min: 0.0                 # Minimum valid relative humidity (%)
    max: 100.0               # Maximum valid relative humidity (%)
  pressure:
    min: 800.0               # Minimum valid pressure (hPa) — optional field
    max: 1200.0              # Maximum valid pressure (hPa) — optional field

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging:
  level: "info"              # Options: debug, info, warn, error
  file: ""                   # Log file path (leave empty "" to log to stdout only)
  max_size_mb: 50            # Rotate log file when it reaches this size
  console: true              # Also print logs to stdout

# ------------------------------------------------------------
# Cloud Sync — Huawei IoTDA
# ------------------------------------------------------------
# Set enabled: true and fill in credential after device registration.
# credential is the device secret assigned by IoTDA — NEVER commit this file.
# ------------------------------------------------------------
cloud:
  enabled: false             # Set to true after registration
  provider: "huawei"         # Cloud provider (currently only huawei)
  endpoint: ""               # e.g. "https://iotda.cn-north-4.myhuaweicloud.com"
  project_id: ""             # Huawei Cloud project ID
  device_id: ""              # Device ID registered in IoTDA
  credential: ""             # Device secret (HMAC-SHA256 signing key)

# ------------------------------------------------------------
# I²C Pin Assignment (informational — used by firmware, not backend)
# Included here for reference so all hardware config is in one place.
# ------------------------------------------------------------
# firmware:
#   i2c_sda_pin: 8
#   i2c_scl_pin: 9
#   sensor: "SHT31"          # or "BME280"
#   oled_address: "0x3C"
#   sensor_address: "0x44"   # SHT31 default; BME280 is 0x76 or 0x77
#   sample_interval_ms: 2000  # How often the ESP32 reads and transmits
